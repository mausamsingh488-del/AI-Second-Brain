{% extends "base.html" %}

{% block title %}Smart Tasks | {{ app_name }}{% endblock %}
{% block page_title %}Smart Task Management{% endblock %}

{% block content %}
<div class="container-fluid px-0">

  <!-- TOP FILTER AND ACTION BAR -->
  <div class="glass-panel p-3 mb-4">
    <div class="row g-3 align-items-center">
      <!-- Search Input -->
      <div class="col-lg-4 col-md-6">
        <div class="input-group">
          <span class="input-group-text bg-dark border-0 text-muted" style="border-radius: 10px 0 0 10px;">
            <i class="fa-solid fa-magnifying-glass"></i>
          </span>
          <input type="text" id="taskSearchInput" class="form-control bg-dark text-white border-0" placeholder="Search tasks by keyword..." style="border-radius: 0 10px 10px 0; font-size: 0.9rem;" oninput="filterTasks()">
        </div>
      </div>

      <!-- Category Filter -->
      <div class="col-lg-3 col-md-3 col-6">
        <select id="taskCategoryFilter" class="form-select bg-dark text-white border-0" style="border-radius: 10px; font-size: 0.88rem;" onchange="filterTasks()">
          <option value="All">All Categories</option>
          <option value="College">🎓 College</option>
          <option value="Internship">💼 Internship</option>
          <option value="Coding">💻 Coding</option>
          <option value="Personal">🧘 Personal</option>
          <option value="Fitness">💪 Fitness</option>
          <option value="GitHub">🐙 GitHub</option>
        </select>
      </div>

      <!-- Priority Filter -->
      <div class="col-lg-2 col-md-3 col-6">
        <select id="taskPriorityFilter" class="form-select bg-dark text-white border-0" style="border-radius: 10px; font-size: 0.88rem;" onchange="filterTasks()">
          <option value="All">All Priorities</option>
          <option value="Urgent">🔴 Urgent</option>
          <option value="High">🟠 High</option>
          <option value="Medium">🟢 Medium</option>
          <option value="Low">⚪ Low</option>
        </select>
      </div>

      <!-- Status Filter Tabs / Button -->
      <div class="col-lg-3 col-12 d-flex justify-content-lg-end gap-2">
        <button class="btn btn-primary-brain d-flex align-items-center gap-2 w-100 justify-content-center" data-bs-toggle="modal" data-bs-target="#addTaskModal">
          <i class="fa-solid fa-plus"></i>
          <span>Add New Task</span>
        </button>
      </div>
    </div>
  </div>

  <!-- STATUS TABS -->
  <div class="d-flex gap-2 mb-3">
    <button class="btn btn-sm btn-outline-brain active-tab-pill" id="tabAll" onclick="setStatusTab('all')">All Tasks (<span id="countAll">0</span>)</button>
    <button class="btn btn-sm btn-dark text-muted" id="tabPending" onclick="setStatusTab('pending')">Pending (<span id="countPending">0</span>)</button>
    <button class="btn btn-sm btn-dark text-muted" id="tabCompleted" onclick="setStatusTab('completed')">Completed (<span id="countCompleted">0</span>)</button>
  </div>

  <!-- TASKS GRID -->
  <div class="row g-3" id="tasksCardsContainer">
    <div class="col-12 text-center py-5 text-muted">
      <i class="fa-solid fa-spinner fa-spin me-2"></i>Loading smart tasks...
    </div>
  </div>

</div>

<!-- ADD TASK MODAL -->
<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-panel text-white" style="background: rgba(28, 20, 14, 0.96); border: 1px solid var(--border-glass);">
      <div class="modal-header border-bottom" style="border-color: rgba(90, 62, 43, 0.35) !important;">
        <h5 class="modal-title fw-bold" id="addTaskModalLabel">
          <i class="fa-solid fa-plus-circle me-2" style="color: var(--color-primary);"></i>Create New Task
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="createTaskForm" onsubmit="handleCreateTask(event)">
        <div class="modal-body d-flex flex-column gap-3">
          <div>
            <label class="form-label text-muted" style="font-size: 0.8rem;">Task Title *</label>
            <input type="text" id="newTaskTitle" class="form-control bg-dark text-white border-0" placeholder="e.g. Finish ESP32 PCB circuit diagram" required>
          </div>
          <div>
            <label class="form-label text-muted" style="font-size: 0.8rem;">Description</label>
            <textarea id="newTaskDesc" class="form-control bg-dark text-white border-0" rows="3" placeholder="Context, requirements, links or steps..."></textarea>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label text-muted" style="font-size: 0.8rem;">Category</label>
              <select id="newTaskCategory" class="form-select bg-dark text-white border-0">
                <option value="College">College</option>
                <option value="Internship">Internship</option>
                <option value="Coding">Coding</option>
                <option value="Personal">Personal</option>
                <option value="Fitness">Fitness</option>
                <option value="GitHub">GitHub</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label text-muted" style="font-size: 0.8rem;">Priority</label>
              <select id="newTaskPriority" class="form-select bg-dark text-white border-0">
                <option value="Urgent">Urgent</option>
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
          </div>
          <div>
            <label class="form-label text-muted" style="font-size: 0.8rem;">Due Date</label>
            <input type="date" id="newTaskDueDate" class="form-control bg-dark text-white border-0">
          </div>
        </div>
        <div class="modal-footer border-top" style="border-color: rgba(90, 62, 43, 0.35) !important;">
          <button type="button" class="btn btn-dark text-muted" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary-brain">Save Task</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- EDIT TASK MODAL -->
<div class="modal fade" id="editTaskModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-panel text-white" style="background: rgba(28, 20, 14, 0.96); border: 1px solid var(--border-glass);">
      <div class="modal-header border-bottom" style="border-color: rgba(90, 62, 43, 0.35) !important;">
        <h5 class="modal-title fw-bold">
          <i class="fa-solid fa-pen-to-square me-2" style="color: var(--color-primary);"></i>Edit Task
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="editTaskForm" onsubmit="handleEditTask(event)">
        <input type="hidden" id="editTaskId">
        <div class="modal-body d-flex flex-column gap-3">
          <div>
            <label class="form-label text-muted" style="font-size: 0.8rem;">Task Title</label>
            <input type="text" id="editTaskTitle" class="form-control bg-dark text-white border-0" required>
          </div>
          <div>
            <label class="form-label text-muted" style="font-size: 0.8rem;">Description</label>
            <textarea id="editTaskDesc" class="form-control bg-dark text-white border-0" rows="3"></textarea>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label text-muted" style="font-size: 0.8rem;">Category</label>
              <select id="editTaskCategory" class="form-select bg-dark text-white border-0">
                <option value="College">College</option>
                <option value="Internship">Internship</option>
                <option value="Coding">Coding</option>
                <option value="Personal">Personal</option>
                <option value="Fitness">Fitness</option>
                <option value="GitHub">GitHub</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label text-muted" style="font-size: 0.8rem;">Priority</label>
              <select id="editTaskPriority" class="form-select bg-dark text-white border-0">
                <option value="Urgent">Urgent</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
            </div>
          </div>
          <div>
            <label class="form-label text-muted" style="font-size: 0.8rem;">Due Date</label>
            <input type="date" id="editTaskDueDate" class="form-control bg-dark text-white border-0">
          </div>
        </div>
        <div class="modal-footer border-top" style="border-color: rgba(90, 62, 43, 0.35) !important;">
          <button type="button" class="btn btn-dark text-muted" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary-brain">Update Task</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/tasks.js') }}"></script>
{% endblock %}
